<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ProximityLink</title>
    <meta
      name="description"
      content="ProximityLink is currently in development."
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07101f;
        color: white;
      }

      main {
        min-height: 100vh;
        background: #07101f;
        color: white;
      }

      .page {
        max-width: 1024px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 64px 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .card {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 32px;
        padding: 32px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: rgba(255, 255, 255, 0.5);
      }

      h1 {
        max-width: 820px;
        margin: 0 0 16px;
        font-size: clamp(40px, 7vw, 64px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .intro {
        max-width: 680px;
        margin: 0;
        font-size: 18px;
        line-height: 1.75;
        color: rgba(255, 255, 255, 0.72);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .button-primary {
        background: white;
        color: #07101f;
      }

      .button-secondary {
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.85);
      }

      footer {
        padding: 40px 0;
        text-align: center;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>

  <body>
    <main>
      <section class="page">
        <div class="card">
          <p class="eyebrow">ProximityLink</p>

          <h1>Intelligent proximity tools for operational response.</h1>

          <p class="intro">
            ProximityLink is currently in development. More information will be
            available soon.
          </p>

          <div class="buttons">
            <a class="button button-primary" href="mailto:solacebibleapp@gmail.com">
              Contact
            </a>

            <a class="button button-secondary" href="/solace/">
              Solace Bible App
            </a>
          </div>
        </div>

        <footer>© 2026 Benjamin Perry-Grout</footer>
      </section>
    </main>
  </body>
</html>
